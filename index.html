<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Go digital, fuel smarter, and get rewarded with IPT Smart." />
    <title>IPT Smart</title>
    <link rel="stylesheet" href="/scss/main.scss" />
  </head>


  <body>
    <main>
      <section class="hero" aria-labelledby="hero-title" data-node-id="1:4130">
        <header class="hero__header">
          <a class="hero__brand" href="/" aria-label="IPT Smart home" data-node-id="1:4132">
            <img src="/images/svgs/ipt-logo.svg" alt="IPT Smart" width="207" height="84" />
          </a>
        </header>

        <h1 class="hero__title" id="hero-title" data-node-id="1:4131">
          <span class="hero__title-line">
            Go digital <strong>fuel smarter</strong>
          </span>
          <span class="hero__title-line">Get rewarded</span>
        </h1>
        

        <article class="floating-card station-card" data-node-id="605:1538" aria-label="Amchit 77 station">
          <div class="floating-card__surface station-card__surface" data-node-id="605:1540">
            <div class="station-card__content" data-node-id="605:1541">
              <img
                class="station-card__pin"
                src="/images/svgs/amchit77-pin.svg"
                alt=""
                width="23"
                height="23"
                data-node-id="605:1542"
              />
              <div class="station-card__details" data-node-id="605:1556">
                <strong class="station-card__name" data-node-id="605:1560">Amchit 77</strong>
                <span class="station-card__address" data-node-id="605:1561">
                  Amchit, Beirut - Amchit Highway- Near Mcdonalds
                </span>
                <span class="station-card__distance" data-node-id="605:1562">1.73 km</span>
                <img
                  class="station-card__logos"
                  src="/images/svgs/amchit77-logos-hug.svg"
                  alt=""
                  width="238"
                  height="18"
                  data-node-id="605:1563"
                />
              </div>
            </div>
          </div>
        </article>

        <article class="floating-card visits-card" data-node-id="590:2493">
          <div class="floating-card__surface visits-card__surface" data-node-id="590:2494">
            <img
              class="visits-card__artwork"
              src="/images/your-visits.png"
              alt="Your visits reward progress: every 40 liters earns one slot, with 10 out of 10 slots required"
              width="276"
              height="122"
              data-node-id="590:2495"
            />
          </div>
        </article>

        <article class="floating-card balance-card" data-node-id="590:2497" aria-label="IPT Smart balance">
          <div class="floating-card__surface balance-card__surface" data-node-id="590:2498">
            <div class="balance-card__content" data-node-id="590:2499">
              <div class="balance-card__tabs" data-node-id="590:2501">
                <span class="balance-card__tab is-active" data-node-id="590:2502">My Balance</span>
                <span class="balance-card__tab" data-node-id="590:2504">OMT Pay</span>
              </div>

              <div class="balance-card__body" data-node-id="590:2506">
                <div class="balance-card__summary" data-node-id="590:2507">
                  <div class="balance-card__amount" data-node-id="590:2508">
                    <strong data-node-id="590:2510">1,360 pts</strong>
                    <span data-node-id="590:2513">Silver Tier</span>
                  </div>
                  <img
                    class="balance-card__meter"
                    src="/images/svgs/fuel-meter.svg"
                    alt="Fuel meter showing progress toward premium tier"
                    width="132"
                    height="76"
                    data-node-id="590:2516"
                  />
                </div>

                <div class="balance-card__progress" data-node-id="590:2534">
                  <span data-node-id="590:2535">Earn <strong>287 Points</strong> to reach premium tier</span>
                  <img src="/images/svgs/i-icon.svg" alt="" width="13" height="13" data-node-id="590:2536" />
                </div>
              </div>
            </div>
          </div>
        </article>

        <div class="hero__visual-track">
          <div class="hero__visual-pin">
            <figure class="hero__visual" data-node-id="1:4157">
              <div class="hero__phone-carousel" aria-label="IPT Smart app screens">
                <div class="hero__phone-carousel-track">
                  <div class="hero__phone-carousel-slide is-active">
                    <img src="/images/phonepic1.png" alt="IPT Smart rewards screen" />
                  </div>
                  <div class="hero__phone-carousel-slide">
                    <img src="/images/phonepic2.png" alt="IPT Smart app screen" />
                  </div>
                  <div class="hero__phone-carousel-slide">
                    <img src="/images/phonepic3.png" alt="IPT Smart app screen" />
                  </div>
                  <div class="hero__phone-carousel-slide">
                    <img src="/images/phonepic4.png" alt="IPT Smart app screen" />
                  </div>
                </div>
              </div>
              <img
                src="/images/hand.png"
                alt="A hand holding a phone"
                width="1512"
                height="1649"
              />
            </figure>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
